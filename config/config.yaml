# ============================================================
#  本地代理服务器 —— 主配置
#  内核: Mihomo Meta v1.19.32
#  监听: 127.0.0.1:7890 (HTTP + SOCKS5 混合端口，仅本机)
# ============================================================
#  【必读】本文件上游节点为空。
#  本地代理只负责: 分流规则 + DNS 防污染 + 协议转换。
#  它自己不能出境。用下面命令导入上游后即可工作:
#      scripts\ctl.ps1 -Action Import -Source "<订阅URL>"
#  导入会自动生成 config.runtime.yaml，本文件保持为干净模板。
# ============================================================

mixed-port: 7890            # HTTP + SOCKS5 混合入口
allow-lan: false            # 安全关键: 只监听回环，不对局域网暴露
bind-address: 127.0.0.1
mode: rule                  # rule=按规则分流 | global=全局代理 | direct=全直连
log-level: info
ipv6: false                 # 关掉 IPv6，避免绕过代理泄漏真实流量

# ---------- 外部控制面板 ----------
external-controller: 127.0.0.1:9090
secret: ""                  # 仅本机访问，留空即可
external-ui: ui             # 面板目录，内核会自动下载
external-ui-name: "metacubexd"
external-ui-url: "https://ghproxy.net/https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"

# ---------- 性能 ----------
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

# ============================================================
#  DNS 防污染 —— 打开 Google 的关键一环
#  实测本机 www.google.com 被投毒为 157.240.7.20 (Facebook 的 IP)
#  解决思路:
#    1) 国外域名走加密解析，绕开国内 DNS 投毒
#    2) 国内域名走国内 DNS，保证 CDN 就近、速度正常
#    3) fake-ip: 立即返回假 IP，真实解析交给上游代理完成
# ============================================================
dns:
  enable: true
  ipv6: false
  # 不开放对外 DNS 端口。理由:
  #   浏览器/CLI 都走 7890 混合端口，域名以 CONNECT/HTTP 形式传给内核，
  #   由 fake-ip 在内部完成解析 —— 全流程不依赖对外 DNS 服务。
  #   实测该端口对部分查询格式返回 FORMERR，留着只会误导排查。
  #   如确需给其它程序提供防污染 DNS，删掉下面这行即可重新启用。
  listen: ""
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:            # 这些必须拿真实 IP，否则系统/局域网功能会坏
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "localhost.ptlogin2.qq.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "stun.*.*"
  default-nameserver:        # 用于解析下面 DoH 域名自身，必须是纯 IP
    - 223.5.5.5
    - 119.29.29.29
  nameserver:                # 默认解析器：必须是「无代理也能通」的服务器
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:   # 解析「节点服务器域名」，必须直连解析
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query
  nameserver-policy:
    "geosite:cn,private":
      - https://223.5.5.5/dns-query
      - https://1.12.12.12/dns-query
    "geosite:geolocation-!cn":   # 国外域名 -> 加密解析，防投毒
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query
  # 兜底解析器。实测 1.1.1.1 / 8.8.8.8 在无代理时完全不可达(000, 6s 超时)，
  # 因此这里必须配置 timeout，否则每次解析都会白等 5 秒。
  # 有上游后这些查询会随代理隧道出去；没上游时靠 timeout 快速放弃。
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    - https://223.5.5.5/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
  # 关键：缩短兜底等待，避免污染域名每次解析卡 5 秒
  fallback-timeout: 800
  # 让 DNS 查询也遵守分流规则（有上游时国外 DNS 走代理隧道出去，防投毒更彻底）
  respect-rules: true

# ============================================================
#  上游节点 —— 空数组，等待导入
# ============================================================
proxies: []

proxy-providers: {}
# 订阅自动更新模式（推荐，导入时加 -UseProvider 可自动生成）:
#  my-sub:
#    type: http
#    url: "订阅链接"
#    interval: 3600
#    path: ./providers/my-sub.yaml
#    health-check: { enable: true, url: https://www.gstatic.com/generate_204, interval: 300 }

# ============================================================
#  策略组 —— 可在面板手动切换
# ============================================================
proxy-groups:
  - name: PROXY
    type: select
    proxies: [DIRECT]

  - name: 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies: [DIRECT]

  - name: 故障转移
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies: [DIRECT]

  - name: 手动选择
    type: select
    proxies: [DIRECT]

  - name: AI
    type: select
    proxies: [PROXY, DIRECT]

  - name: 广告拦截
    type: select
    proxies: [REJECT, DIRECT]

# ============================================================
#  分流规则（自上而下匹配，命中即停）
# ============================================================
rules:
  - GEOSITE,category-ads-all,广告拦截
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,openai,AI
  - GEOSITE,anthropic,AI
  - GEOSITE,google-gemini,AI
  - GEOSITE,category-ai-!cn,AI
  - GEOSITE,github,PROXY
  - GEOSITE,gfw,PROXY
  - GEOSITE,geolocation-!cn,PROXY
  - GEOSITE,cn,DIRECT
  - GEOSITE,private,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,PROXY

# ============================================================
#  GeoSite/GeoIP 数据源（走镜像，直连 GitHub 会被墙）
# ============================================================
geodata-mode: true
geox-url:
  geoip: "https://ghproxy.net/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://ghproxy.net/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://ghproxy.net/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.metadb"

profile:
  store-selected: true
  store-fake-ip: true
# ============================================================
#  freeVPN 手机配置 —— 分流版
# ============================================================
#  策略:
#    国内网站  -> 直连，速度优先，不隐藏 IP
#    国外网站  -> 全部经 WARP，隐藏真实 IP
#
#  同时堵住两个与"分流"无关的泄漏点:
#    1. IPv6: 开启 ipv6 让虚拟网卡接管 IPv6。
#       若关闭，运营商分配的 IPv6 会绕过 VPN，
#       无论访问国内还是国外都会暴露真实地址。
#    2. WebRTC/STUN: 用端口规则把 STUN 强制塞进隧道。
#       网页用 JS 查 STUN 就能拿到公网 IP，与走哪条路无关。
#
#  国外流量没有直连退路: WARP 挂掉时国外站点会打不开，
#  而不是静默退回真实 IP。国内站点不受影响。
# ============================================================

mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning

# ---- IPv6 总开关: 必须为 true ----
# FlClash 的 VpnService.kt 只在 ipv6=true 时才给虚拟网卡加 IPv6 路由，
# 否则日志写 "IPv6 VPN address is not supported" 且不加路由,
# 手机就会用运营商的 IPv6 直接出网, 真实 IP 立刻暴露。
ipv6: true

# ---------- DNS ----------
dns:
  enable: true
  # 不返回 AAAA 记录: 让 App 走 IPv4,
  # 这样国外流量走隧道里更可靠的 IPv4 通道。
  # 注意这只影响"域名解析结果", 不影响 IPv6 是否被隧道接管 ——
  # 接管由上面的 ipv6: true 负责。
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "stun.*.*"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 只用国内可达的解析器。fake-ip 模式下这里只决定"要不要真解析",
  # 真实解析由代理隧道内部完成(remote-dns-resolve), 所以不会造成污染;
  # 若写成国外 DoH(1.1.1.1), 代理未就绪时会全部超时。
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query

# ---------- 上游节点 ----------
proxies:
  # ---- WireGuard：运营商未封 UDP 2408 时更快 ----
  - name: "WARP-WireGuard"
    type: wireguard
    server: 162.159.192.1
    port: 2408
    ip: 172.16.0.2/32
    private-key: "sEpFRT110Gy6OA2+UIf3a74atacmEijkSQPii99H8E4="
    public-key: "bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo="
    udp: true
    mtu: 1280
    reserved: [254, 14, 128]

  # ---- MASQUE：走 QUIC 443，能穿透封锁 UDP 2408 的网络（实测可用）----
  - name: "WARP-MASQUE"
    type: masque
    server: 162.159.198.2
    port: 443
    private-key: "MHcCAQEEICNuogZpRAGOIdRovpXVnGaqEvaGMVNLY5cFr+hHMFWaoAoGCCqGSM49AwEHoUQDQgAEW2PsopfHcYM/79jTJdLU3jifqq0CdQkCHns1YFBsc4J2r6EEsE3eotE3mAcGjgQ3IOLA7mQfb/R8dPnzonjEvw=="
    public-key: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEIaU7MToJm9NKp8YfGxR6r+/h4mcG7SxI8tsW8OR1A5tv/zCzVbCRRh2t87/kxnP6lAy0lkr7qYwu+ox+k3dr6w=="
    ip: 172.16.0.2
    ipv6: 2606:4700:110:881a:7805:d348:197:895c
    mtu: 1280
    udp: true
    # 关键：MASQUE 是 IP 隧道，必须先把域名解析成 IP。
    # 默认用本机 DNS 解析，而国内 DNS 对 google.com 返回投毒结果，
    # 隧道会拿着假 IP 去连接并超时。开启后域名在隧道内用 1.1.1.1 解析。
    remote-dns-resolve: true
    dns: [1.1.1.1, 1.0.0.1]
    handshake-timeout: 30

proxy-groups:
  - name: PROXY
    type: select
    proxies: ["自动选择", "WARP-MASQUE", "WARP-WireGuard"]

  # 自动挑延迟最低的可用节点。
  # 刻意不放 DIRECT: 国外流量失败就失败, 绝不静默退回真实 IP。
  - name: 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150
    timeout: 10000
    proxies: ["WARP-MASQUE", "WARP-WireGuard"]

  - name: 故障转移
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 10000
    proxies: ["WARP-MASQUE", "WARP-WireGuard"]

  - name: AI
    type: select
    proxies: ["自动选择", PROXY]

  - name: 广告拦截
    type: select
    proxies: [REJECT]

# ---------- 规则 ----------
rules:
  # ---- 1. WebRTC / STUN 封堵（最高优先级，与分流无关）----
  # STUN 用来发现公网 IP。若不拦截，网页可通过 JS 拿到真实 IP，
  # 哪怕它访问的站点本身走了代理。这里强制塞进隧道。
  - DST-PORT,3478,PROXY
  - DST-PORT,5349,PROXY
  - DST-PORT,19302,PROXY
  - DST-PORT,19305,PROXY
  - DST-PORT,19307,PROXY
  - DST-PORT,19308,PROXY
  - DST-PORT,19309,PROXY
  - DST-PORT,50000-50100,PROXY

  # ---- 2. 局域网 / 本机：直连（这些地址不出公网，无需隐藏）----
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  # ---- 3. 广告拦截 ----
  - GEOSITE,category-ads-all,广告拦截

  # ---- 4. 国内：直连，速度优先（按你的要求不隐藏 IP）----
  - GEOSITE,cn,DIRECT
  # 国内 IPv6 段也走直连(GEOIP 库含 IPv6，所以国内 IPv6 不会被绕去国外)
  - GEOIP,CN,DIRECT

  # ---- 5. 其余全部是国外：强制走 WARP，隐藏真实 IP ----
  - MATCH,PROXY

# ---------- 规则数据 ----------
geodata-mode: true
geox-url:
  geoip: "https://ghproxy.net/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://ghproxy.net/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"

profile:
  store-selected: true
  store-fake-ip: true

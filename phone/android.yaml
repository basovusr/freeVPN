# ============================================================
#  freeVPN 手机配置 —— 隐私加固版
# ============================================================
#  目标: 让所有对外访问都看不出真实 IP。
#
#  三重防护:
#    1. 全隧道    所有流量(含国内)经 WARP，只有局域网直连
#    2. IPv6 接管 开启 ipv6，让虚拟网卡把 IPv6 也一起接住
#    3. STUN 封堵 WebRTC 用的 UDP 端口强制走隧道
#
#  ⚠ 代价: 国内网站也会绕道海外，百度从 0.06s 变成 2s 左右。
#     若要恢复速度，把文件末尾 rules 里的 GEOSITE,cn,DIRECT
#     那两行注释去掉即可（但国内网站就会看到你的真实 IP）。
#
#  ⚠ 没有 DIRECT 退路: WARP 挂掉时会直接断网，而不是悄悄用真实 IP。
#     这是有意的 —— 宁可断网也不泄漏。
# ============================================================

mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning

# ---- IPv6 总开关 ----
# 必须为 true: FlClash 只在 ipv6=true 时才给虚拟网卡加 IPv6 路由。
# 若为 false，手机会用运营商分配的 IPv6 直接出网，真实 IP 立刻暴露。
ipv6: true

# ---------- DNS ----------
dns:
  enable: true
  # 开启才能在隧道内处理 AAAA 记录
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # IPv6 的假 IP 池
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "stun.*.*"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  # 只用国内可达的解析器。fake-ip 模式下这里只决定"要不要真解析"，
  # 真实解析由代理隧道内部完成，所以不会造成污染；
  # 但若写成国外 DoH(1.1.1.1)，代理未就绪时会全部超时。
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query

# ---------- 上游节点 ----------
proxies:
  # ---- WireGuard：运营商未封 UDP 2408 时更快 ----
  - name: "WARP-WireGuard"
    type: wireguard
    server: 162.159.192.1
    port: 2408
    ip: 172.16.0.2/32
    private-key: "sEpFRT110Gy6OA2+UIf3a74atacmEijkSQPii99H8E4="
    public-key: "bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo="
    udp: true
    mtu: 1280
    reserved: [254, 14, 128]

  # ---- MASQUE：走 QUIC 443，能穿透封锁 UDP 2408 的网络（实测可用）----
  - name: "WARP-MASQUE"
    type: masque
    server: 162.159.198.2
    port: 443
    private-key: "MHcCAQEEICNuogZpRAGOIdRovpXVnGaqEvaGMVNLY5cFr+hHMFWaoAoGCCqGSM49AwEHoUQDQgAEW2PsopfHcYM/79jTJdLU3jifqq0CdQkCHns1YFBsc4J2r6EEsE3eotE3mAcGjgQ3IOLA7mQfb/R8dPnzonjEvw=="
    public-key: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEIaU7MToJm9NKp8YfGxR6r+/h4mcG7SxI8tsW8OR1A5tv/zCzVbCRRh2t87/kxnP6lAy0lkr7qYwu+ox+k3dr6w=="
    ip: 172.16.0.2
    ipv6: 2606:4700:110:881a:7805:d348:197:895c
    mtu: 1280
    udp: true
    # 关键：MASQUE 是 IP 隧道，必须先把域名解析成 IP。
    # 默认用本机 DNS 解析，国内 DNS 对 google.com 返回投毒结果，
    # 于是拿着假 IP 去连接必然超时。开启后域名在隧道内用 1.1.1.1 解析。
    remote-dns-resolve: true
    dns: [1.1.1.1, 1.0.0.1]
    handshake-timeout: 30

proxy-groups:
  - name: PROXY
    type: select
    proxies: ["自动选择", "WARP-MASQUE", "WARP-WireGuard"]

  # 自动挑延迟最低的可用节点。刻意不放 DIRECT: 失败就失败，不泄漏。
  - name: 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150
    timeout: 10000
    proxies: ["WARP-MASQUE", "WARP-WireGuard"]

  # 依次尝试，全部失败则断网（不退回直连）
  - name: 故障转移
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 10000
    proxies: ["WARP-MASQUE", "WARP-WireGuard"]

  - name: AI
    type: select
    proxies: ["自动选择", PROXY]

  - name: 广告拦截
    type: select
    proxies: [REJECT]

# ---------- 规则 ----------
rules:
  # ---- 1. WebRTC / STUN 封堵（最高优先级）----
  # STUN 用 UDP 发现公网 IP。手机端 TUN 能看到这些包，
  # 用端口规则强制塞进隧道，网页拿到的就是 WARP 的出口 IP。
  - DST-PORT,3478,PROXY
  - DST-PORT,5349,PROXY
  - DST-PORT,19302,PROXY
  - DST-PORT,19305,PROXY
  - DST-PORT,19307,PROXY
  - DST-PORT,19308,PROXY
  - DST-PORT,19309,PROXY
  # 常见 WebRTC 媒体端口段（仅在命中时才走代理，不影响其它流量）
  - DST-PORT,50000-50100,PROXY

  # ---- 2. 局域网/本机：必须直连（这些地址本来就不出公网）----
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  # ---- 3. 广告拦截 ----
  - GEOSITE,category-ads-all,广告拦截

  # ---- 4. 其余全部走 WARP（全隧道）----
  # 如需恢复国内直连速度，取消下面两行注释即可（会暴露真实 IP）
  # - GEOSITE,cn,DIRECT
  # - GEOIP,CN,DIRECT
  - MATCH,PROXY

# ---------- 规则数据 ----------
geodata-mode: true
geox-url:
  geoip: "https://ghproxy.net/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://ghproxy.net/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"

profile:
  store-selected: true
  store-fake-ip: true

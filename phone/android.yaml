# ============================================================
#  freeVPN 手机配置 (FlClash / ClashMetaForAndroid)
# ============================================================
#  上游: Cloudflare WARP (免费)
#
#  本配置同时提供两种传输, 由内核自动挑选可用的那个:
#    WARP-MASQUE       走 QUIC 443, 能穿透封锁 UDP 2408 的网络 (推荐)
#    WARP-WireGuard    走 UDP 2408, 未封锁时更快
#
#  自动选择 / 故障转移 组会测延迟并选最快的可用节点,
#  全部不可用时退回 DIRECT (不会导致完全断网)。
#
#  导入方式: 直接填 URL 导入, 之后会自动更新
# ============================================================

mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
ipv6: false

# ---------- DNS 防污染 ----------
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "stun.*.*"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://223.5.5.5/dns-query
    - https://1.12.12.12/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
  # 关键: 国外域名也走国内可用的解析器。
  # 在 fake-ip 模式下返回的只是假 IP, 真实解析由代理隧道内完成,
  # 所以这里用国内 DNS 不会造成污染 —— 但如果写成国外 DoH,
  # 代理尚未就绪时解析会直接失败, 导致健康检查无法通过、
  # url-test 选不出节点, 形成死循环。
  # 刻意不配置 nameserver-policy:
  #   fake-ip 模式下, 被代理的域名应当只拿到一个假 IP (198.18.x.x),
  #   真实解析由代理隧道内部完成 —— 这才是防污染的关键。
  #   若在此显式指定解析器, mihomo 会去解析真实 IP,
  #   国内 DNS 对 google.com 返回的是投毒结果 (实测 174.132.167.252 /
  #   31.13.92.37), 代理就会拿着假 IP 去连接, 必然超时。
  #   实测: 去掉本段后 Google / YouTube 才能正常访问。
  # 不配置 fallback: 它指向的国外 DoH 在代理就绪前不可达,
  # 会让每次解析都白等到超时。代理就绪后真实解析由隧道内完成。

# ---------- 上游节点 ----------
proxies:
  # WireGuard 端点：若运营商没封 UDP 2408 会更快
  - name: "WARP-WireGuard"
    type: wireguard
    server: 162.159.192.1
    port: 2408
    ip: 172.16.0.2/32
    private-key: "sEpFRT110Gy6OA2+UIf3a74atacmEijkSQPii99H8E4="
    public-key: "bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo="
    udp: true
    mtu: 1280
    reserved: [254, 14, 128]

  - name: "WARP-WireGuard-备"
    type: wireguard
    server: 162.159.193.1
    port: 2408
    ip: 172.16.0.2/32
    private-key: "sEpFRT110Gy6OA2+UIf3a74atacmEijkSQPii99H8E4="
    public-key: "bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo="
    udp: true
    mtu: 1280
    reserved: [254, 14, 128]

  # MASQUE 端点：走 QUIC 443，与普通 HTTPS 流量难以区分，
  # 实测能穿透封锁 UDP 2408 的网络（推荐）
  - name: "WARP-MASQUE"
    type: masque
    server: 162.159.198.2
    port: 443
    private-key: "MHcCAQEEICNuogZpRAGOIdRovpXVnGaqEvaGMVNLY5cFr+hHMFWaoAoGCCqGSM49AwEHoUQDQgAEW2PsopfHcYM/79jTJdLU3jifqq0CdQkCHns1YFBsc4J2r6EEsE3eotE3mAcGjgQ3IOLA7mQfb/R8dPnzonjEvw=="
    public-key: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEIaU7MToJm9NKp8YfGxR6r+/h4mcG7SxI8tsW8OR1A5tv/zCzVbCRRh2t87/kxnP6lAy0lkr7qYwu+ox+k3dr6w=="
    ip: 172.16.0.2
    ipv6: 2606:4700:110:881a:7805:d348:197:895c
    mtu: 1280
    udp: true
    # 关键: MASQUE 是 IP 隧道, 必须先把域名解析成 IP。
    # 默认用本机 DNS 解析, 而国内 DNS 对 google.com 返回的是投毒结果,
    # 于是会拿着假 IP 去连接并超时。开启 remote-dns-resolve 后,
    # 域名会在隧道内部用 Cloudflare DNS 解析, 绕开投毒。
    remote-dns-resolve: true
    dns: [1.1.1.1, 1.0.0.1]
    handshake-timeout: 30

  # MASQUE over HTTP/2，QUIC 被限速时的备选
  - name: "WARP-MASQUE-H2"
    type: masque
    server: 162.159.198.2
    port: 443
    network: h2
    private-key: "MHcCAQEEICNuogZpRAGOIdRovpXVnGaqEvaGMVNLY5cFr+hHMFWaoAoGCCqGSM49AwEHoUQDQgAEW2PsopfHcYM/79jTJdLU3jifqq0CdQkCHns1YFBsc4J2r6EEsE3eotE3mAcGjgQ3IOLA7mQfb/R8dPnzonjEvw=="
    public-key: "MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEIaU7MToJm9NKp8YfGxR6r+/h4mcG7SxI8tsW8OR1A5tv/zCzVbCRRh2t87/kxnP6lAy0lkr7qYwu+ox+k3dr6w=="
    ip: 172.16.0.2
    ipv6: 2606:4700:110:881a:7805:d348:197:895c
    mtu: 1280
    udp: true
    # 关键: MASQUE 是 IP 隧道, 必须先把域名解析成 IP。
    # 默认用本机 DNS 解析, 而国内 DNS 对 google.com 返回的是投毒结果,
    # 于是会拿着假 IP 去连接并超时。开启 remote-dns-resolve 后,
    # 域名会在隧道内部用 Cloudflare DNS 解析, 绕开投毒。
    remote-dns-resolve: true
    dns: [1.1.1.1, 1.0.0.1]
    handshake-timeout: 30

proxy-groups:
  - name: PROXY
    type: select
    proxies: ["自动选择", "WARP-MASQUE", "WARP-WireGuard", "故障转移", DIRECT]

  # 自动挑延迟最低的可用节点；MASQUE 放前面，网络封 2408 时它会胜出
  - name: 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 150
    timeout: 10000
    proxies: ["WARP-MASQUE", "WARP-WireGuard", "WARP-MASQUE-H2", "WARP-WireGuard-备"]

  # 依次尝试，全挂则退回直连
  - name: 故障转移
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 10000
    proxies: ["WARP-MASQUE", "WARP-WireGuard", "WARP-MASQUE-H2", "WARP-WireGuard-备", DIRECT]

  - name: AI
    type: select
    proxies: ["自动选择", PROXY, DIRECT]

  - name: 广告拦截
    type: select
    proxies: [REJECT, DIRECT]

# ---------- 分流规则 ----------
rules:
  - GEOSITE,category-ads-all,广告拦截
  - GEOIP,private,DIRECT,no-resolve
  - GEOSITE,openai,AI
  - GEOSITE,anthropic,AI
  - GEOSITE,google-gemini,AI
  - GEOSITE,category-ai-!cn,AI
  - GEOSITE,github,PROXY
  - GEOSITE,gfw,PROXY
  - GEOSITE,geolocation-!cn,PROXY
  - GEOSITE,cn,DIRECT
  - GEOSITE,private,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,PROXY

# ---------- 规则数据 ----------
geodata-mode: true
geox-url:
  geoip: "https://ghproxy.net/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://ghproxy.net/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"

profile:
  store-selected: true
  store-fake-ip: true
